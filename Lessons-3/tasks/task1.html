<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Задача 1</h1>
    <p>З клавіатури вводяться імена двох дітей та кількість у них цукерок. Вивести не екран ім’я тієї дитини, у якої кількість цукерок є більшою, або вивести, що кількість однакова.
</p>
<script>
let firstChildName = prompt("Введіть ім'я першоії дитини");
let firstCoutCandy = parseInt(prompt("Введіть кількість цукерків у першої дитини"));
let secondChildName = prompt("Введіть ім'я другоъ дитини");
let secondCoutCandy = parseInt(prompt("Введіть кількість цукерків у другої дитини"));

if(firstCoutCandy>secondCoutCandy){
    document.write(`У ${firstChildName} є більше цукерок`)
}else if(firstCoutCandy<secondCoutCandy){
    document.write(`У ${secondChildName} є більше цукерок`)

}else if(firstCoutCandy == secondCoutCandy){
    document.write(`Кількість цукерок однакова`)
}else document.write(`Ви ввели невірні дані`);


</script>
</body>
</html>
