<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Задача 0</h1>
    <p>
         Обчислити значення виразів
    </p>
    <ol>
        <li>S1 = a + 12 + b</li>
        <li>S2 = &radic;((a+b)/2*a)</li>
        <li>S3 = <sup>3</sup> &radic;((a+b)*c)</li>
        <li>S4 = sin (a/-b)</li>

    </ol>

    <script>
        //введення початкових даних
        let a = parseFloat(prompt("Введіть значення для змінної а:","4"));
        let b = parseFloat(prompt("Введіть значення для змінної b:","2"));
        let c = parseFloat(prompt("Введіть значення для змінної c:","3"));

        //обчислення виразів
        let s1 = a + 12 + b;
        let s2 = Math.sqrt(( a + b ) / (2 * a ));
        let s3 = Math.cbrt(( a + b) * c);
        let s4 = Math.sin(a / -b); 

        //виводимо результати
        document.write(`S1 = ${s1}<br>`);
        document.write(`S2 = ${s2.toFixed(3)}<br>`);
        document.write(`S3 = ${s3.toFixed(3)}<br>`);
        document.write(`S4 = ${s4.toFixed(3)}<br>`);

    </script>
</body>
</html>
