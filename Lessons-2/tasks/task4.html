<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Задача 3</h1>
    <p>
        Дано вартість одиниці товару і кількість. Знайти загальну вартість та ПДВ (5% від загальної вартості).

    </p>
    <script>
        let unitPrice = parseFloat(prompt("Введи вартість одиниці товару"));
        let quantity = parseInt(prompt("Введіть кількість товару"));

        let totalPrice = unitPrice * quantity;
        let vat = totalPrice * 0.05;

        document.write(`Загальна вартість складає: ${totalPrice.toFixed(2)}<br> ПДВ складає:${vat.toFixed(2)}`);
    </script>
</body>
</html>
